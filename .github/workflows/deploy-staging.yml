name: Deploy staging
on:
  push:
    branches: [main]

concurrency:
  group: staging
  cancel-in-progress: false

# Least privilege: the job only deploys via FLY_API_TOKEN and never uses GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (a moving tag can be repointed at
      # malicious code). Bump deliberately when updating.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master@2026-07
      - run: flyctl deploy --remote-only
        env:
          # App-scoped deploy token (`fly tokens create deploy -a sunroom-staging`),
          # stored as a repo secret. Never echoed.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
