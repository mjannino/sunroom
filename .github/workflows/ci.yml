name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build before typecheck/test: sunroom's own source imports its published
      # `sunroom/client` subpath (-> dist/client.d.ts), so the type declarations
      # must exist before `tsc --noEmit` can resolve them.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node packages/sunroom/scripts/check-directives.mjs
